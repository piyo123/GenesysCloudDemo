<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" /><!-- to control layout on mobile browsers -->
    <title>Genesys Cloud Web Messenger - Custom UI</title>
    <style type="text/css">
        :root {
            --bg: #f7f7f8;
            --fg: #0f172a;
            --muted: #94a3b8;
            --me: #dbeafe;
            --other: #e5e7eb;
            --accent: #2563eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
            background: var(--bg);
            color: var(--fg);
        }

        .wrap {
            max-width: 720px;
            margin: 24px auto;
            padding: 16px;
        }

        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
        }

        .header {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
        }

        .title {
            font-weight: 600;
        }

        .messages {
            height: 420px;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }

        .msg {
            max-width: 75%;
            padding: 10px 12px;
            border-radius: 12px;
            line-height: 1.4;
            word-wrap: break-word;
            white-space: pre-wrap;
            border: 1px solid #e5e7eb;
        }

        .me {
            align-self: flex-end;
            background: var(--me);
        }

        .other {
            align-self: flex-start;
            background: var(--other);
        }

        .meta {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        .inputbar {
            border-top: 1px solid #f1f5f9;
            padding: 10px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
        }

        .text {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 16px;
        }

        .btn {
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #fff;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .messages::-webkit-scrollbar {
            width: 10px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        @media (max-width: 520px) {
            .messages {
                height: 60vh;
            }
        }
    </style>

    <script type="text/javascript" charset="utf-8">
        (function (g, e, n, es, ys) {
            g['_genesysJs'] = e;
            g[e] = g[e] || function () {
                (g[e].q = g[e].q || []).push(arguments)
            };
            g[e].t = 1 * new Date();
            g[e].c = es;
            ys = document.createElement('script'); ys.async = 1; ys.src = n; ys.charset = 'utf-8'; document.head.appendChild(ys);
        })(window, 'Genesys', 'https://apps.mypurecloud.jp/genesys-bootstrap/genesys.min.js', {
            environment: '<PUT_YOUR_ENVIRONMENT_STRING>',
            deploymentId: '<PUT_YOUR_DEPLOYMENT_ID>'
        });
    </script>

</head>

<body>
    <h1>Genesys Cloud Web Messenger - Custom UI</h1>

    <div class="wrap">
        <div class="card" role="application" aria-label="チャットUI">
            <div class="header">
                <span class="dot" aria-hidden="true"></span>
                <div class="title">デモチャット</div>
                <button id="clear" class="btn" type="button" title="会話をクリア">🗑️</button>
            </div>
            <div id="messages" class="messages" aria-live="polite"></div>
            <div class="inputbar">
                <input id="text" class="text" type="text" placeholder="メッセージを入力…" />
                <button id="send" class="btn" type="button">送信</button>
            </div>
        </div>
    </div>

</body>

</html>

<script type="text/javascript">

    // ****************************************************************
    // Main Entry Point of Genesys Cloud Web Messenger
    // ****************************************************************
    var newSession = true;
    window.addEventListener('DOMContentLoaded', () => {
        (async() => {
            await main()
        })();
    });

    async function main() {
        clearBtn.addEventListener('click', clearConversationAsync)
        sendBtn.addEventListener('click', mySend);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); mySend(); }
        });

        try {
            ret = await onMessagingServiceReady();
            console.log("Messaging Service is Ready.");
            console.log(ret);

            if (newSession) {
                await configureConversationAsync(); 
                await joinConversationAsync();
            }

        } catch (error) {
            console.log("CHECK!");
            console.log(error);
        }
    }

    // ****************************************************************
    // Event Handler Scripts related to Genesys Cloud Web Messenger
    // ****************************************************************

    Genesys("subscribe", "MessagingService.started", (event) => {
        const data = event.data;
        newSession = data.newSession;
        console.log(`MessagingService.started. authenticated=${data.authenticated}, newSession=${data.newSession}, readOnly=${data.readOnly}`);
        console.log(event);
    });

    // Published when there is any new message added to the conversation.
    // Refer to the body attribute here for message object data format.
    // https://developer.genesys.cloud/commdigital/digital/webmessaging/websocketapi#outbound-messages
    Genesys('subscribe', 'MessagingService.messagesReceived', async (event) => {
        const data = event.data;
        console.log("MessagingService.messagesReceived");
        console.log(event);
        const messages = data.messages || [];
        drawMessages(messages);


        // Clear Conversation (not documented)
        if (event.data.messages[0].type == "Event" && event.data.messages[0].events[0].eventType == "Presence" && event.data.messages[0].events[0].presence.type == "Clear") {
            console.log("MessagingService.messagesReceived && Conversation Cleared.");
            document.querySelector("#messages").innerHTML = "";
            
            //await configureConversationAsync();
            //await joinConversationAsync();
            //Genesys("command", "MessagingService.resetConversation", {}, null, null);
            //await startConversationAsync();
            location.reload();
        }

        // Disconnected (not documented)
        if (event.data.messages[0].type == "Event" && event.data.messages[0].events[0].eventType == "Presence" && event.data.messages[0].events[0].presence.type == "Disconnect") {
            console.log("MessagingService.messagesReceived && Disconnected.");
            input.disabled = true;
            sendBtn.disabled = true;
        }
    });

    // Events not occurs in my case
    Genesys("subscribe", "MessagingService.convresationCleared", (event) => {
        const data = event.data;
        console.log("MessagingService.convresationCleared");
        document.querySelector("#messages").innerHTML = "";
    });

    // Published when conversation session has been restored after page navigation or page refresh. 
    // It may not include all the messages with in the session, but a limited set of recent messages. 
    // More older messages are available in the oldMessages event.
    Genesys("subscribe", "MessagingService.restored", (event) => {
        console.log("MessagingService.restored");
        console.log(event);
        drawHistoricalMessages(event.data.messages);
    });

    // Published when end user started typing.
    Genesys("subscribe", "MessagingService.clientTypingStarted", () => {
        console.log("MessagingService.clientTypingStarted");
    });

    // Published when new agent typing event has been received.
    Genesys("subscribe", "MessagingService.typingReceived", (event) => {
        console.log("MessagingService.typingReceived");
    });

    // Published when agent typing event has timed out after durationMs and will be removed.
    Genesys("subscribe", "MessagingService.typingTimeout", () => {
        console.log
    });

    // Published when the history is fetched successfully after MessagingService.fetchHistory command was executed.
    // In a real world scenario, previous pages are fetched when user keeps scrolling up in the Messenger transcript.
    Genesys("subscribe", "MessagingService.oldMessages", (event) => {
        console.log("MessagingService.oldMessages");
        console.log(event);
    });

    // Published when all the previous messages in a conversation are fetched and no more old messages exist.
    Genesys("subscribe", "MessagingService.historyComplete", () => {
        console.log("MessagingService.historyComplete; All the previous messages are fetched successfully.");
    });

    // Published after the conversation is successfully reset from previous disconnect read only state.
    Genesys("subscribe", "MessagingService.conversationReset", (event) => {
        console.log("MessagingService.conversationReset");
    });

    Genesys("subscribe", "MessagingService.error", (event) => {
        console.log("MessagingService.error");
        console.log(event);
    });

    
    // ****************************************************************
    // Helper Scripts related to Genesys Cloud Web Messenger
    // ****************************************************************

    // Promisify this synchronous function
    function onMessagingServiceReady() {
        return new Promise((resolve) => {
            Genesys('subscribe', 'MessagingService.ready', resolve);
        });
    }

    // Promisify this synchronous function
    function startConversationAsync() {
        return new Promise((resolve, reject) => {
            Genesys(
                "command",
                "MessagingService.startConversation",
                {},
                () => {
                    // fulfilled callback
                    resolve();
                },
                (error) => {
                    // rejected callback
                    reject(error);
                }
            );
        });
    }

    // Promisify this synchronous function
    function clearConversationAsync() {
        return new Promise((resolve, reject) => {
            Genesys(
                "command",
                "MessagingService.clearConversation",
                {},
                (data) => resolve(data), // fulfilled
                (error) => reject(error) // rejected
            );
        });
    }

    // Promisify this synchronous function
    /*
     An alternative command replacing MessagingService.startConversation command which only establishes the WebSocket connection and configure the conversation session.
     When auto start conversation is enabled, this command will not send the JOIN event. You must use MessagingService.joinConversation command to send the JOIN event for starting the conversation.
     This will help in cases where you only want to configure the conversation initially but then wait to start the conversation until Messenger is opened.

     Note: When auto start is enabled, if the conversation is not started after configuring the new conversation and the Messenger/page is reloaded, 
     then it will no more be a new conversation as it will try to restore the existing conversation that was configured earlier.
     You must clear this conversation using MessagingService.clearConversation command and configure a new one to autostart.
    */
    function configureConversationAsync() {
        return new Promise((resolve, reject) => {
            Genesys(
                "command",
                "MessagingService.configureConversation",
                {},
                (data) => resolve(data), // fulfilled
                (error) => reject(error) // rejected
            );
        });
    }

    // Promisify this synchronous function
    /*
     In headless mode, when auto start conversation is enabled and the conversation isn't started yet but only the WebSocket connection is established using the MessagingService.
     configureConversation command and it is a new session, use this command to send the JOIN event for starting the conversation.
     To determine if your session is new one, please refer to the property in the MessagingService.started event data. "newSession"

     Note: This is only applicable in headless mode and must be used after MessagingService.
     configureConversation command which will establish the WebSocket connection waiting for this command to start the conversation.
     If the conversation is not started but the Messenger/page is reloaded, then it will no more be a new conversation as it will try to restore the existing conversation that was configured earlier.
     You must clear this conversation using MessagingService.clearConversation command and configure a new one to autostart.

     Note: Executing this command after MessagingService.startConversation command will have no effect as it would have already started the conversation.
    */
    function joinConversationAsync() {
        return new Promise((resolve, reject) => {
            Genesys(
                "command",
                "MessagingService.joinConversation",
                {},
                (data) => resolve(data), // fulfilled
                (error) => reject(error) // rejected
            );
        });
    }

    // Promisify this synchronous function
    function sendMessageAsync(message) {
        return new Promise((resolve, reject) => {
            Genesys(
                'command',
                'MessagingService.sendMessage',
                { message },
                (data) => resolve(data), // fulfilled
                (error) => reject(error) // rejected
            );
        });
    }

    // Send a message
    async function mySend() {
        const text = input.value;
        if (!text.trim()) return;
        input.value = '';
        input.focus();

        try {
            await sendMessageAsync(text);
        } catch (e) {
            console.log(e);
        }
    }

    // Draw messages for real time updates
    function drawMessages(messages) {
        messages.forEach((message) => {
            if (message.text) {
                if (message.direction === 'Inbound') {
                    addMessage(message.text, 'me');
                } else if (message.direction === 'Outbound') {
                    addMessage(message.text, 'other');
                }
            }
        });
    }

    // Draw messages for restoring
    function drawHistoricalMessages(messages) {
        // Messages are stored newest first, so sort by posted datetime ascending
        const sorted_messages = [...messages].sort((a, b) =>  {
            return new Date(a.timestamp) - new Date(b.timestamp);
        });
        sorted_messages.forEach((message) => {
            if (message.text) {
                if (message.messageType === 'inbound') {
                    addMessage(message.text, 'me', new Date(message.timestamp));
                } else if (message.messageType === 'outbound') {
                    addMessage(message.text, 'other', new Date(message.timestamp));
                }
            }
        });
    }


    // ****************************************************************
    // Web Chat related scripts
    // ****************************************************************
    const $ = (sel) => document.querySelector(sel);
    const messages = $('#messages');
    const input = $('#text');
    const sendBtn = $('#send');
    const clearBtn = $('#clear');

    function addMessage(text, who, datetime = new Date()) {
        const div = document.createElement('div');
        div.className = `msg ${who}`;
        div.innerText = text.trim();

        const meta = document.createElement('span');
        const t = datetime;
        meta.className = 'meta';
        meta.textContent = `${who === 'me' ? 'あなた' : 'オペレーター'} ・ ${t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        div.appendChild(meta);

        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }
    
</script>
